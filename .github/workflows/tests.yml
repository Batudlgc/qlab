name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # All six suites run offline: no market data is downloaded.
      - name: Engine sanity checks (lookahead, embargo, deflated Sharpe)
        run: python research/00_sanity_checks.py

      - name: Order book tests
        run: python research/03_lob_tests.py

      - name: Competition harness tests
        run: python research/09_prosperity_tests.py

      - name: Crypto data layer tests
        run: python research/11_smc_data_tests.py

      - name: Market structure tests
        run: python research/13_smc_structure_tests.py

      - name: Trade simulator tests
        run: python research/14_smc_trade_tests.py

  reports:
    # Re-runs the seeded experiments and checks every figure the notes quote.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, to compare code against each output's stamped commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Report figures reproduce from the code
        run: python research/reproduce.py --check
